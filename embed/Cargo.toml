[package]
name = "naga-rust-embed"
version = "0.3.2"
edition = "2024"
rust-version.workspace = true
description = "Translates WGSL shader code to Rust embedded in your Rust code."
repository.workspace = true
license.workspace = true
categories = [
    "compilers", # includes transpilers
    "rendering", # we help you run shaders
]
keywords = [
    "naga", # related to Naga
    "naga-rust", # keyword for this family of crates
    "shader", # we process shaders, and Naga itself has this keyword
    "wgsl", # our input language
]

[features]
# `"std"` is enabled by default because disabling it may be slower.
default = ["std"]
# If enabled, implement texture access traits for `Box`, `Rc`, and `Arc`.
alloc = ["naga-rust-rt/alloc"]
# Implement `bytemuck` traits for `naga_rust_embed::rt` types.
# This does not affect generated code; that must be configured separately.
bytemuck = ["naga-rust-rt/bytemuck"]
# If enabled, use `std`’s math functions instead of `libm`’s (which may be faster),
# as well as the functionality of the `"alloc"` feature.
std = ["alloc", "naga-rust-rt/std"]

[dependencies]
naga-rust-macros = { version = "0.4.1", path = "../macros" }
naga-rust-rt = { version = "0.4.0", path = "../rt", default-features = false }

exhaust.workspace = true
indoc.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
